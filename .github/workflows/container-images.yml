name: Independent container images
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'deploy/compose.env.example'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:
    inputs:
      component:
        description: Image to build (publishing is opt-in)
        required: true
        type: choice
        options: [web, api]
      publish:
        description: Publish selected image to GHCR using the commit SHA tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, api]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file deploy/compose.env.example --profile local-redis config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${OWNER,,}/vocespace-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.component == matrix.component
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' || inputs.component == matrix.component
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.component == matrix.component }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
