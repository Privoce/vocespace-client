name: vocespace
services:
  web:
    image: vocespace-web:local
    build:
      context: .
      target: web
      secrets: [vocespace_config]
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:3030:3030"]
    volumes:
      - ./deploy/api-data:/data:ro
    depends_on:
      api:
        condition: service_healthy
  api:
    image: vocespace-api:local
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports: ["127.0.0.1:3031:3031"]
    volumes:
      - ./deploy/api-data:/data
secrets:
  vocespace_config:
    file: ./deploy/api-data/vocespace.conf.json
